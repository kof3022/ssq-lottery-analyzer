<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双色球走势分析</title>
<style>
  :root { --red:#DC2626; --blue:#2563EB; --ink:#1F2328; --muted:#6B7280; --line:#E5E7EB; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; color:var(--ink);
         background:#fff; line-height:1.7; padding:40px 20px 60px; max-width:720px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:28px; }
  header .seal { width:64px; height:64px; flex-shrink:0; opacity:.92; }
  header .seal img { width:100%; height:100%; object-fit:contain; display:block; }
  header h1 { font-size:22px; font-weight:600; letter-spacing:.5px; }
  header .sub { color:var(--muted); font-size:13px; margin-top:4px; }
  section { margin-bottom:32px; }
  h2 { font-size:15px; font-weight:600; margin-bottom:12px; }
  .latest { background:#FAFAFA; border-radius:8px; padding:16px 20px; }
  .latest .meta { font-size:13px; color:var(--muted); margin-bottom:8px; }
  .balls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .ball { width:38px; height:38px; border-radius:50%; color:#fff; display:inline-flex;
          align-items:center; justify-content:center; font-size:16px; font-weight:600; }
  .ball.red { background:var(--red); }
  .ball.blue { background:var(--blue); }
  .divider { color:var(--muted); }
  .actions { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  input[type=text] { width:150px; padding:9px 12px; font-size:15px; border:1px solid var(--line);
                     border-radius:6px; outline:none; }
  input[type=text]:focus { border-color:var(--ink); }
  button { padding:9px 18px; font-size:14px; border:1px solid var(--ink); border-radius:6px;
           background:#fff; color:var(--ink); cursor:pointer; transition:all .15s; }
  button:hover { background:var(--ink); color:#fff; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { border-color:var(--line); color:var(--muted); }
  button.ghost:hover { border-color:var(--ink); color:var(--ink); background:#fff; }
  .status { font-size:13px; color:var(--muted); }
  .result { border-top:1px solid var(--line); padding-top:24px; }
  .target { font-size:13px; color:var(--muted); margin-bottom:14px; }
  .rec { padding:18px 20px; border:1px solid var(--line); border-radius:8px; margin-bottom:20px; }
  .rec .label { font-size:12px; color:var(--muted); margin-bottom:10px; letter-spacing:1px; }
  .rec .line { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .rec .blue-note { margin-left:4px; font-size:13px; color:var(--muted); }
  .trio { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-bottom:20px; }
  @media (max-width:560px){ .trio{ grid-template-columns:1fr; } }
  .cell h3 { font-size:13px; font-weight:600; margin-bottom:8px; }
  .cell p { font-size:14px; }
  .cell .muted { color:var(--muted); font-size:12px; }
  .ball.small { width:30px; height:30px; font-size:13px; }
  .ml-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
  @media (max-width:560px){ .ml-grid{ grid-template-columns:1fr; } }
  .detail { display:none; }
  .detail.open { display:block; }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-bottom:18px; }
  th,td { padding:6px 8px; text-align:center; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  td.num { font-weight:600; }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; }
  .tag.hot { background:#FEE2E2; color:var(--red); }
  .tag.bu { background:#DBEAFE; color:var(--blue); }
  footer { border-top:1px solid var(--line); padding-top:16px; font-size:12px; color:var(--muted); }
  .warn { font-size:12px; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>双色球走势分析</h1>
      <div class="sub" id="dataStatus">数据加载中…</div>
    </div>
    <div class="seal" title="作者印章"><img src="/img/flycat2025.png" alt="作者印章"></div>
  </header>

  <section>
    <h2>最新开奖</h2>
    <div class="latest" id="latestBox">
      <div class="meta" id="latestMeta">—</div>
      <div class="balls" id="latestBalls"></div>
    </div>
  </section>

  <section>
    <h2>操作</h2>
    <div class="actions">
      <button id="btnRefresh">刷新最新数据</button>
      <span class="divider">|</span>
      <input type="text" id="issueInput" placeholder="输入期号，如 2026091" maxlength="7">
      <button id="btnAnalyze">开始分析</button>
      <button id="btnNext" class="ghost">快捷：分析下一期</button>
    </div>
    <div class="status" id="actionStatus" style="margin-top:8px;"></div>
  </section>

  <section class="result" id="resultBox" hidden>
    <h2>分析结果</h2>
    <div class="target" id="targetInfo"></div>
    <div class="rec" id="recBox"></div>
    <div class="rec" id="mlBox" hidden></div>
    <div class="trio" id="trioBox"></div>
    <button id="btnDetail" class="ghost">查看频率明细（528期+16期）</button>
    <div class="detail" id="detailBox" style="margin-top:16px;"></div>
  </section>

  <footer>
    数据来源：中国福彩官网公开开奖数据。<br>
    本工具仅基于历史数据的频率与遗漏做统计展示，彩票开奖结果独立随机，不构成任何投注建议，请理性购彩。
  </footer>

<script>
const $ = id => document.getElementById(id);
const api = { data:"/api/data", refresh:"/api/refresh", analyze:"/api/analyze" };

function ballsHtml(reds, blue){
  return reds.map(n => `<span class="ball red">${n<10?"0"+n:n}</span>`).join("")
    + `<span class="divider">|</span><span class="ball blue">${blue<10?"0"+blue:blue}</span>`;
}

function showStatus(msg, ok){ $("actionStatus").textContent = msg; }

async function loadData(){
  try{
    const r = await fetch(api.data);
    const d = await r.json();
    renderLatest(d.latest, d.refresh_time, d.total);
  }catch(e){ $("dataStatus").textContent = "数据加载失败：" + e.message; }
}

function renderLatest(latest, time, total){
  if(!latest){ $("dataStatus").textContent = "暂无数据，请点击刷新"; return; }
  $("latestMeta").textContent = `第 ${latest["期号"]} 期　${latest["开奖日期"]}　本地共 ${total} 期`;
  $("latestBalls").innerHTML = ballsHtml(latest["红球"], latest["蓝球"]);
  $("dataStatus").textContent = `数据已更新至 ${latest["期号"]}（${time || ""}）`;
}

async function refreshData(){
  const btn = $("btnRefresh");
  btn.disabled = true; btn.textContent = "刷新中…";
  showStatus("正在从官网获取最新开奖…");
  try{
    const r = await fetch(api.refresh, {method:"POST"});
    const d = await r.json();
    if(!d.ok) throw new Error(d.msg || "刷新失败");
    renderLatest(d.latest, d.refresh_time, d.total);
    showStatus(`刷新完成，已更新至 ${d.latest["期号"]}`);
  }catch(e){
    showStatus("刷新失败：" + e.message);
  }finally{
    btn.disabled = false; btn.textContent = "刷新最新数据";
  }
}

function fmtOm(om){ return om === null ? "—" : om + "期"; }
function fmtAvg(a){ return a === null ? "—" : a.toFixed(1); }
function statusTag(item){
  if(item.cur_om === 0) return `<span class="tag hot">热(上期开出)</span>`;
  if(item.avg_om !== null && item.cur_om !== null && item.cur_om >= item.avg_om)
    return `<span class="tag bu">补漏</span>`;
  return `<span class="tag">常态</span>`;
}

function zoneTable(title, z){
  let rows = z.items.map(it =>
    `<tr><td class="num">${it.n<10?"0"+it.n:it.n}</td><td>${it.count}</td><td>${it.freq}%</td>` +
    `<td>${fmtOm(it.cur_om)}</td><td>${fmtAvg(it.avg_om)}</td><td>${statusTag(it)}</td></tr>`).join("");
  return `<table><thead><tr><th>${title}</th><th>次数</th><th>频率</th><th>当前遗漏</th><th>平均遗漏</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function doAnalyze(issue){
  issue = (issue || "").trim();
  if(!/^\d{7}$/.test(issue)){ showStatus("请输入7位期号，如 2026091"); return; }
  const btn = $("btnAnalyze");
  btn.disabled = true; btn.textContent = "分析中…";
  showStatus("正在分析…");
  try{
    const r = await fetch(api.analyze + "?issue=" + issue);
    const d = await r.json();
    if(!d.ok){ showStatus("分析失败：" + (d.msg||"")); return; }
    renderResult(d);
    showStatus("分析完成");
  }catch(e){
    showStatus("分析失败：" + e.message);
  }finally{
    btn.disabled = false; btn.textContent = "开始分析";
  }
}

function renderResult(d){
  const w = d.window;
  let target = `目标期 <b>${d.target_issue}</b>`;
  if(d.target_draw){
    target += `（已开奖：${d.target_draw["开奖日期"]}）`;
  }else{
    target += "（待开奖）";
  }
  target += `　第一轮前${w.count}期（${w.start}–${w.end}）＋近16期第二轮`;
  $("targetInfo").innerHTML = target;

  const rounds = d.rounds;
  const comb = rounds.combined;
  const fmtN = n => n<10?"0"+n:n;
  let recHtml = `<div class="label">综合推荐一注（前528期 ＋ 近16期加权）</div><div class="line">` +
    comb.red.map(fmtN).map(n => `<span class="ball red">${n}</span>`).join("") +
    `<span class="divider">|</span><span class="ball blue">${fmtN(comb.blue)}</span>` +
    `</div>`;
  recHtml += `<div class="warn">第一轮（前528期 ${rounds.long.window.start}–${rounds.long.window.end}）：红 ${rounds.long.recommend.red.map(fmtN).join(" ")} | 蓝 ${fmtN(rounds.long.recommend.blue)}</div>`;
  recHtml += `<div class="warn">第二轮（近16期 ${rounds.short.window.start}–${rounds.short.window.end}）：红 ${rounds.short.recommend.red.map(fmtN).join(" ")} | 蓝 ${fmtN(rounds.short.recommend.blue)}</div>`;
  if(d.target_draw){
    recHtml += `<div class="warn">实际开奖：` + ballsHtml(d.target_draw["红球"], d.target_draw["蓝球"]) +
      `（可用于对比验证）</div>`;
  }
  $("recBox").innerHTML = recHtml;

  const trio = [];
  ["一区(1-11)","二区(12-22)","三区(23-33)"].forEach(name => {
    const z = d.zones[name];
    trio.push(`<div class="cell"><h3>${name}</h3>` +
      `<p>推荐 <b>${z.top.map(n=>n<10?"0"+n:n).join(" ")}</b></p>` +
      `<p class="muted">备选 ${z.backup.map(n=>n<10?"0"+n:n).join(" ")||"—"}</p>` +
      `<p class="muted">补漏 ${z.bule.map(n=>n<10?"0"+n:n).join(" ")||"—"}</p></div>`);
  });
  const zb = d.zones["蓝球(1-16)"];
  trio.push(`<div class="cell"><h3>蓝球(1-16)</h3>` +
    `<p>推荐 <b>${zb.top.map(n=>n<10?"0"+n:n).join(" ")}</b></p>` +
    `<p class="muted">备选 ${zb.backup.map(n=>n<10?"0"+n:n).join(" ")||"—"}</p>` +
    `<p class="muted">补漏 ${zb.bule.map(n=>n<10?"0"+n:n).join(" ")||"—"}</p></div>`);
  renderML(d.ml);
  $("trioBox").innerHTML = trio.join("");

  let detail = "";
  ["一区(1-11)","二区(12-22)","三区(23-33)"].forEach(name => {
    detail += zoneTable(name + "（前528期）", d.zones[name]);
  });
  detail += zoneTable("蓝球(1-16)（前528期）", d.zones["蓝球(1-16)"]);
  ["一区(1-11)","二区(12-22)","三区(23-33)"].forEach(name => {
    detail += zoneTable(name + "（近16期）", d.rounds.short.zones[name]);
  });
  detail += zoneTable("蓝球(1-16)（近16期）", d.rounds.short.zones["蓝球(1-16)"]);
  $("detailBox").innerHTML = detail;
  $("resultBox").hidden = false;
}

function renderML(ml){
  if(!ml) return;
  const balls = (arr, cls) => arr.map(x => `<span class="ball ${cls} small">${x.n<10?"0"+x.n:x.n}</span>`).join("");
  const plist = arr => arr.map(x => `${x.n<10?"0"+x.n:x.n} ${Math.round(x.p*100)}%`).join(" · ");
  let h = `<div class="label">机器学习推荐（决策树 + 随机森林）</div>`;
  h += `<div class="line">融合一注：${balls(ml.fusion.red,"red")}<span class="divider">|</span>${balls(ml.fusion.blue,"blue")}</div>`;
  h += `<div class="ml-grid">`;
  h += `<div class="cell"><h3>决策树</h3><p>红球 ${plist(ml.dt.red)}</p><p class="muted">蓝球 ${plist(ml.dt.blue)}</p></div>`;
  h += `<div class="cell"><h3>随机森林</h3><p>红球 ${plist(ml.rf.red)}</p><p class="muted">蓝球 ${plist(ml.rf.blue)}</p></div>`;
  h += `</div>`;
  h += `<div class="warn">样本：红球 ${ml.sample.red} 条、蓝球 ${ml.sample.blue} 条；训练 ${ml.train_sec} 秒。概率为模型估计值，仅供参考。</div>`;
  $("mlBox").innerHTML = h;
  $("mlBox").hidden = false;
}

$("btnRefresh").addEventListener("click", refreshData);
$("btnAnalyze").addEventListener("click", () => doAnalyze($("issueInput").value));
$("issueInput").addEventListener("keydown", e => { if(e.key === "Enter") doAnalyze($("issueInput").value); });
$("btnNext").addEventListener("click", async () => {
  try{
    const r = await fetch(api.data);
    const d = await r.json();
    if(!d.latest) return;
    const next = String(Number(d.latest["期号"]) + 1);
    $("issueInput").value = next;
    doAnalyze(next);
  }catch(e){ showStatus("获取最新期号失败"); }
});
$("btnDetail").addEventListener("click", () => {
  const open = $("detailBox").classList.toggle("open");
  $("btnDetail").textContent = open ? "收起频率明细" : "查看频率明细（528期+16期）";
});

loadData();
</script>
</body>
</html>
